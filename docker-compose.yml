services:
  postgres:
    image: postgres:16-alpine
    container_name: vet_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vet_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-vet_app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vet_admin} -d ${POSTGRES_DB:-vet_app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
