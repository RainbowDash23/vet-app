<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VetApp - Actualizaciones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0c0e12;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      border: 1px solid #27272a;
      border-radius: 8px;
      -webkit-app-region: drag;
    }
    .non-draggable {
      -webkit-app-region: no-drag;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: #151922;
      border: 1px solid #27272a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f4f4f5;
      margin-bottom: 4px;
    }
    .version-tag {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 24px;
      font-family: monospace;
    }
    .status-text {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 16px;
      text-align: center;
      min-height: 20px;
    }
    .progress-wrapper {
      width: 100%;
      max-width: 320px;
      height: 6px;
      background-color: #1a1f2c;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #0ea5e9;
      border-radius: 9999px;
      transition: width 0.2s ease;
    }
    .progress-info {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 20px;
    }
    .action-btn {
      display: none;
      background-color: #0ea5e9;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      margin-top: 8px;
    }
    .action-btn:hover {
      background-color: #0284c7;
    }
    .skip-btn {
      background: transparent;
      border: none;
      color: #52525b;
      font-size: 12px;
      cursor: pointer;
      margin-top: 16px;
      text-decoration: underline;
    }
    .skip-btn:hover {
      color: #a1a1aa;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #0ea5e9;
      margin-left: 6px;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="8" r="2" fill="#0ea5e9" />
      <circle cx="17" cy="8" r="2" fill="#0ea5e9" />
      <circle cx="10" cy="4.5" r="1.5" fill="#0ea5e9" />
      <circle cx="14" cy="4.5" r="1.5" fill="#0ea5e9" />
      <path d="M12 11c-3 0-5 1.79-5 4 0 2 1.5 3.5 3 4.5 1 .67 3 .67 4 0 1.5-1 3-2.5 3-4.5 0-2.21-2-4-5-4z" fill="#0ea5e9" />
    </svg>
  </div>

  <h1 class="brand-title">VetApp</h1>
  <div class="version-tag" id="versionTag">v0.1.0</div>

  <div class="status-text" id="statusText">
    Buscando actualizaciones<span class="pulsing-dot"></span>
  </div>

  <div class="progress-wrapper">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="progress-info" id="progressInfo">Comprobando versión...</div>

  <button class="action-btn non-draggable" id="restartBtn">Reiniciar para instalar</button>
  <button class="skip-btn non-draggable" id="skipBtn">Continuar sin actualizar</button>

  <script>
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressInfo = document.getElementById('progressInfo');
    const restartBtn = document.getElementById('restartBtn');
    const skipBtn = document.getElementById('skipBtn');
    const versionTag = document.getElementById('versionTag');

    if (window.electronAPI) {
      if (window.electronAPI.getAppInfo) {
        window.electronAPI.getAppInfo().then(info => {
          if (info && info.version) {
            versionTag.textContent = 'v' + info.version;
          }
        }).catch(() => {});
      }

      if (window.electronAPI.onUpdaterStatus) {
        window.electronAPI.onUpdaterStatus(payload => {
          if (!payload) return;

          if (payload.currentVersion) {
            versionTag.textContent = 'v' + payload.currentVersion;
          }

          switch (payload.state) {
            case 'checking':
              statusText.innerHTML = 'Buscando actualizaciones<span class="pulsing-dot"></span>';
              progressInfo.textContent = 'Verificando con GitHub Releases...';
              progressBar.style.width = '10%';
              break;

            case 'available':
              statusText.textContent = 'Descargando actualización: v' + (payload.version || '');
              progressInfo.textContent = 'Iniciando descarga...';
              progressBar.style.width = '20%';
              break;

            case 'downloading':
              const pct = payload.percent || 0;
              statusText.textContent = 'Descargando actualización... (' + pct + '%)';
              progressBar.style.width = pct + '%';
              progressInfo.textContent = pct + '% completado';
              break;

            case 'downloaded':
              statusText.textContent = '¡Actualización descargada!';
              progressBar.style.width = '100%';
              progressInfo.textContent = 'Lista para instalar v' + (payload.version || '');
              restartBtn.style.display = 'block';
              break;

            case 'not-available':
              statusText.textContent = 'VetApp está actualizado';
              progressBar.style.width = '100%';
              progressInfo.textContent = 'Iniciando aplicación...';
              break;

            case 'error':
              statusText.textContent = 'Continuando con la versión actual';
              progressInfo.textContent = 'No se pudo conectar al servicio de actualizaciones';
              break;
          }
        });
      }

      restartBtn.addEventListener('click', () => {
        if (window.electronAPI.restartAndInstallUpdate) {
          window.electronAPI.restartAndInstallUpdate();
        }
      });

      skipBtn.addEventListener('click', () => {
        if (window.electronAPI.skipUpdate) {
          window.electronAPI.skipUpdate();
        }
      });
    }
  </script>
</body>
</html>
