name: CI

on:
  push:
    branches: [main, dev/**, fix/**, feat/**]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source="/repo" -v --no-banner --gitleaks-ignore-path="/repo/.gitleaksignore"

  test-and-verify:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vet_admin
          POSTGRES_PASSWORD: ci_test_password_secure
          POSTGRES_DB: vet_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vet_admin -d vet_app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: vet_admin
      POSTGRES_PASSWORD: ci_test_password_secure
      POSTGRES_DB: vet_app_db
      POSTGRES_PORT: '5432'
      DATABASE_URL: 'postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public'
      DIRECT_URL: 'postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public'
      JWT_SECRET: 'ci_jwt_secret_must_be_at_least_32_characters_long_super_secure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Deploy Prisma migrations to PostgreSQL service
        run: pnpm --filter @vet-app/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages and apps
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run in-memory E2E tests
        run: pnpm test:e2e

      - name: Run real database E2E tests
        run: pnpm run test:e2e:db
        env:
          USE_REAL_DB: 'true'

      - name: Run desktop UI tests
        run: pnpm --filter @vet-app/desktop run test:ui
