name: CI

on:
  push:
    branches: [main, dev/**, fix/**, feat/**]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 detect --source="/repo" -v --no-banner --gitleaks-ignore-path="/repo/.gitleaksignore"

  audit:
    name: Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Informational Security Audit
        run: |
          echo "Ejecutando pnpm audit en modo informativo (no bloqueante)..."
          pnpm audit || true
        continue-on-error: true

  test-and-verify:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vet_admin
          POSTGRES_PASSWORD: ci_test_password_secure
          POSTGRES_DB: vet_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vet_admin -d vet_app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: vet_admin
      POSTGRES_PASSWORD: ci_test_password_secure
      POSTGRES_DB: vet_app_db
      POSTGRES_PORT: '5432'
      DATABASE_URL: 'postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public'
      DIRECT_URL: 'postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public'
      JWT_SECRET: 'ci_jwt_secret_must_be_at_least_32_characters_long_super_secure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Deploy Prisma migrations to PostgreSQL service
        run: pnpm --filter @vet-app/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages and apps
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Run in-memory E2E tests
        run: pnpm test:e2e

      - name: Run real database E2E tests
        run: pnpm run test:e2e:db
        env:
          USE_REAL_DB: 'true'

      - name: Run desktop UI tests
        run: pnpm --filter @vet-app/desktop run test:ui

  docker-build-and-verify:
    name: Docker Build & Production Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vet_admin
          POSTGRES_PASSWORD: ci_test_password_secure
          POSTGRES_DB: vet_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vet_admin -d vet_app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build -t vet-app-api:prod .

      - name: Run Container & Verify Health Probes
        run: |
          # Generar secretos de alta entropía dinámicamente en memoria (cero persistencia en archivos o logs)
          PROD_JWT_SECRET=$(openssl rand -hex 32)
          PROD_JWT_REFRESH_SECRET=$(openssl rand -hex 32)

          echo "Iniciando contenedor en modo produccion..."
          docker run -d --name vet-api-prod --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL="postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public" \
            -e DIRECT_URL="postgresql://vet_admin:ci_test_password_secure@localhost:5432/vet_app_db?schema=public" \
            -e JWT_SECRET="${PROD_JWT_SECRET}" \
            -e JWT_REFRESH_SECRET="${PROD_JWT_REFRESH_SECRET}" \
            -e NOTIFICATIONS_CRON_ENABLED="false" \
            -e CORS_ORIGIN="http://localhost:5173,https://vetapp.example.com" \
            -e PUBLIC_BASE_URL="http://localhost:3000/p" \
            -e TRUST_PROXY="1" \
            -e MAIL_DRIVER="log" \
            vet-app-api:prod

          echo "Esperando que el contenedor aplique migraciones e inicie el servidor..."
          READY=0
          for i in $(seq 1 40); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Servidor listo en el intento $i (HTTP 200)"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: El contenedor no respondio a /health en el tiempo esperado"
            docker logs vet-api-prod
            exit 1
          fi

          echo "Verificando GET /health (Liveness probe)..."
          LIVENESS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          LIVENESS_BODY=$(curl -s http://localhost:3000/health)
          echo "Status: $LIVENESS_STATUS, Body: $LIVENESS_BODY"
          if [ "$LIVENESS_STATUS" != "200" ]; then
            echo "ERROR: GET /health no respondio 200"
            docker logs vet-api-prod
            exit 1
          fi
          echo "$LIVENESS_BODY" | grep -q '"status":"ok"'

          echo "Verificando GET /health/ready (Readiness probe con BD)..."
          READINESS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/ready)
          READINESS_BODY=$(curl -s http://localhost:3000/health/ready)
          echo "Status: $READINESS_STATUS, Body: $READINESS_BODY"
          if [ "$READINESS_STATUS" != "200" ]; then
            echo "ERROR: GET /health/ready no respondio 200"
            docker logs vet-api-prod
            exit 1
          fi
          echo "$READINESS_BODY" | grep -q '"database":"connected"'

          echo "Todos los health checks de produccion pasaron exitosamente."

      - name: Stop and cleanup container
        if: always()
        run: |
          docker rm -f vet-api-prod 2>/dev/null || true
