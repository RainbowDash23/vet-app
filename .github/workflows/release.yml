name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release en GitHub (true) o solo compilar y subir artefacto (false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Package Windows Desktop Installer
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate VITE_API_URL repository variable
        shell: bash
        run: |
          API_URL="${{ vars.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::Variable de repositorio VITE_API_URL no está configurada en GitHub Actions (Settings > Secrets and variables > Actions > Variables). Configure la URL pública de la API antes de compilar el cliente empaquetado."
            exit 1
          fi
          echo "VITE_API_URL configurada correctamente: $API_URL"

      - name: Validate tag version matches desktop package.json
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Release tag: $TAG_NAME (parsed version: $TAG_VERSION)"
          echo "apps/desktop version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/desktop/package.json version ($PACKAGE_VERSION)!"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION matches apps/desktop/package.json"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @vet-app/shared-types build

      # Nota: Las pruebas, migraciones y validaciones del backend API (Prisma, tests unitarios,
      # E2E en memoria y E2E contra base real) se ejecutan en el workflow de CI principal (.github/workflows/ci.yml).
      # Este workflow de Desktop Release se circunscribe estrictamente a las quality gates del cliente de escritorio
      # (typecheck de shared-types y desktop, tests unitarios del desktop y pruebas de interfaz UI).
      - name: Quality Gate - Typecheck (Shared Types & Desktop)
        run: |
          pnpm --filter @vet-app/shared-types build
          pnpm --filter @vet-app/desktop exec tsc --noEmit

      - name: Build Desktop application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          pnpm --filter @vet-app/desktop run build

      - name: Quality Gate - Desktop Unit Tests
        run: pnpm --filter @vet-app/desktop test

      - name: Quality Gate - Desktop UI Tests
        run: pnpm --filter @vet-app/desktop run test:ui

      - name: Verify commit is on main branch with green CI (for official releases)
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando que la publicación oficial provenga de la rama main..."
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::El commit ${{ github.sha }} no pertenece a la rama main. Las publicaciones oficiales solo se permiten desde main."
            exit 1
          fi

          echo "Verificando que el flujo de CI principal esté en 'success' para el commit ${{ github.sha }}..."
          COMMIT_SHA="${{ github.sha }}"
          MAX_ATTEMPTS=45
          INTERVAL_SEC=20
          CI_OK=false

          for (( i=1; i<=MAX_ATTEMPTS; i++ )); do
            RUNS_JSON=$(gh run list --commit "$COMMIT_SHA" --workflow "CI" --json databaseId,status,conclusion 2>/dev/null || echo "[]")
            
            EVAL_RESULT=$(node -e '
              let data = [];
              try { data = JSON.parse(process.argv[1] || "[]"); } catch (e) { data = []; }
              if (!Array.isArray(data) || data.length === 0) {
                console.log("WAIT_EMPTY");
                process.exit(0);
              }
              const successRun = data.find(r => r.conclusion === "success");
              if (successRun) {
                console.log("SUCCESS:" + successRun.databaseId);
                process.exit(0);
              }
              const activeRun = data.find(r => ["in_progress", "queued", "waiting", "requested", "pending"].includes(r.status));
              if (activeRun) {
                console.log("WAIT_ACTIVE:" + activeRun.databaseId + ":" + activeRun.status);
                process.exit(0);
              }
              const latest = data[0];
              console.log("FAILED:" + (latest.databaseId || "none") + ":" + (latest.conclusion || latest.status || "unknown"));
            ' "$RUNS_JSON")

            case "$EVAL_RESULT" in
              SUCCESS:*)
                RUN_ID="${EVAL_RESULT#SUCCESS:}"
                echo "Flujo de CI principal verificado exitosamente (Run #$RUN_ID con conclusión 'success')."
                CI_OK=true
                break
                ;;
              WAIT_ACTIVE:*)
                INFO="${EVAL_RESULT#WAIT_ACTIVE:}"
                echo "Intento $i/$MAX_ATTEMPTS: Flujo de CI ($INFO) en curso. Esperando $INTERVAL_SEC segundos..."
                sleep $INTERVAL_SEC
                ;;
              WAIT_EMPTY)
                echo "Intento $i/$MAX_ATTEMPTS: Aún no se ha detectado una ejecución de CI para el commit $COMMIT_SHA. Esperando $INTERVAL_SEC segundos..."
                sleep $INTERVAL_SEC
                ;;
              FAILED:*)
                INFO="${EVAL_RESULT#FAILED:}"
                echo "::error::El flujo de CI principal ($INFO) para el commit $COMMIT_SHA no alcanzó el estado requerido 'success'. No se permite publicar el release."
                exit 1
                ;;
              *)
                echo "Intento $i/$MAX_ATTEMPTS: Respuesta de evaluación no esperada ($EVAL_RESULT). Esperando $INTERVAL_SEC segundos..."
                sleep $INTERVAL_SEC
                ;;
            esac
          done

          if [ "$CI_OK" != "true" ]; then
            echo "::error::Tiempo de espera agotado (15 minutos). El flujo de CI principal no alcanzó el estado 'success' para el commit $COMMIT_SHA."
            exit 1
          fi
          echo "Validación de rama main y CI superada exitosamente."

      - name: Package Desktop Installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          echo "Compilando instalador de escritorio localmente con electron-builder (publish: never)..."
          pnpm --filter @vet-app/desktop exec electron-builder --win --publish never

      - name: Upload Installer Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: VetApp-Windows-Installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish Official GitHub Release
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${PACKAGE_VERSION}"
          fi
          RELEASE_TITLE="v${PACKAGE_VERSION}"
          RELEASE_DIR="apps/desktop/release"

          EXE_FILE="$RELEASE_DIR/VetApp-Setup-${PACKAGE_VERSION}.exe"
          YML_FILE="$RELEASE_DIR/latest.yml"
          BLOCKMAP_FILE="$RELEASE_DIR/VetApp-Setup-${PACKAGE_VERSION}.exe.blockmap"

          echo "Verificando existencia de artefactos compilados..."
          if [ ! -f "$EXE_FILE" ]; then
            echo "::error::Archivo del instalador no encontrado: $EXE_FILE"
            exit 1
          fi
          if [ ! -f "$YML_FILE" ]; then
            echo "::error::Archivo de manifiesto latest.yml no encontrado: $YML_FILE"
            exit 1
          fi
          if [ ! -f "$BLOCKMAP_FILE" ]; then
            echo "::error::Archivo blockmap no encontrado: $BLOCKMAP_FILE"
            exit 1
          fi

          echo "Artefactos a publicar:"
          echo " - $EXE_FILE"
          echo " - $YML_FILE"
          echo " - $BLOCKMAP_FILE"

          echo "Verificando si ya existe un release para la etiqueta $TAG_NAME..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "El release para la etiqueta $TAG_NAME ya existe. Actualizando artefactos (clobber) y asegurando publicación oficial..."
            gh release upload "$TAG_NAME" "$EXE_FILE" "$YML_FILE" "$BLOCKMAP_FILE" --clobber
            gh release edit "$TAG_NAME" --draft=false --latest --title "$RELEASE_TITLE"
          else
            echo "Creando nuevo release publicado para $TAG_NAME..."
            gh release create "$TAG_NAME" \
              "$EXE_FILE" \
              "$YML_FILE" \
              "$BLOCKMAP_FILE" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --latest
          fi
          echo "Release $TAG_NAME publicado exitosamente como Latest (no borrador)."
