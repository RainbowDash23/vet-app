name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Publish Windows Desktop Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate tag version matches desktop package.json
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Release tag: $TAG_NAME (parsed version: $TAG_VERSION)"
          echo "apps/desktop version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/desktop/package.json version ($PACKAGE_VERSION)!"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION matches apps/desktop/package.json"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @vet-app/shared-types build

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Quality Gate - Typecheck
        run: pnpm typecheck

      - name: Quality Gate - Unit Tests
        run: pnpm test

      - name: Quality Gate - Desktop UI Tests
        run: pnpm --filter @vet-app/desktop run test:ui

      - name: Build and Publish Desktop Installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter @vet-app/desktop exec electron-builder --win --publish always
