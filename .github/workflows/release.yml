name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release en GitHub (true) o solo compilar y subir artefacto (false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Package Windows Desktop Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate VITE_API_URL repository variable
        shell: bash
        run: |
          API_URL="${{ vars.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::Variable de repositorio VITE_API_URL no está configurada en GitHub Actions (Settings > Secrets and variables > Actions > Variables). Configure la URL pública de la API antes de compilar el cliente empaquetado."
            exit 1
          fi
          echo "VITE_API_URL configurada correctamente: $API_URL"

      - name: Validate tag version matches desktop package.json
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Release tag: $TAG_NAME (parsed version: $TAG_VERSION)"
          echo "apps/desktop version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/desktop/package.json version ($PACKAGE_VERSION)!"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION matches apps/desktop/package.json"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @vet-app/shared-types build

      # Nota: Las pruebas, migraciones y validaciones del backend API (Prisma, tests unitarios,
      # E2E en memoria y E2E contra base real) se ejecutan en el workflow de CI principal (.github/workflows/ci.yml).
      # Este workflow de Desktop Release se circunscribe estrictamente a las quality gates del cliente de escritorio
      # (typecheck de shared-types y desktop, tests unitarios del desktop y pruebas de interfaz UI).
      - name: Quality Gate - Typecheck (Shared Types & Desktop)
        run: |
          pnpm --filter @vet-app/shared-types build
          pnpm --filter @vet-app/desktop exec tsc --noEmit

      - name: Build Desktop application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          pnpm --filter @vet-app/desktop run build

      - name: Quality Gate - Desktop Unit Tests
        run: pnpm --filter @vet-app/desktop test

      - name: Quality Gate - Desktop UI Tests
        run: pnpm --filter @vet-app/desktop run test:ui

      - name: Verify commit is on main branch with green CI (for official releases)
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando que la publicación oficial provenga de la rama main..."
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::El commit ${{ github.sha }} no pertenece a la rama main. Las publicaciones oficiales solo se permiten desde main."
            exit 1
          fi
          echo "Verificando estado del CI en el commit..."
          CI_CONCLUSION=$(gh run list --commit ${{ github.sha }} --workflow "CI" --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
          echo "Resultado de CI para este commit: $CI_CONCLUSION"
          if [ "$CI_CONCLUSION" = "failure" ]; then
            echo "::error::El flujo de CI principal ha fallado para este commit. No se permite publicar un release con CI en rojo."
            exit 1
          fi
          echo "Validación de rama y CI superada exitosamente."

      - name: Package Desktop Installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          if [ "${{ github.event_name == 'push' || inputs.publish == true }}" = "true" ]; then
            echo "Publicando instalador en GitHub Releases..."
            pnpm --filter @vet-app/desktop exec electron-builder --win --publish always
          else
            echo "Compilando instalador sin publicar (modo de prueba / artefacto)..."
            pnpm --filter @vet-app/desktop exec electron-builder --win --publish never
          fi

      - name: Upload Installer Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: VetApp-Windows-Installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
